MEMORY
{
  ZP:        start=$0000, size=$0100, type=rw;
# System RAM layout ($0200-$0FFF):
#   SYS_RAM  $0200-$09ff  SYSRAM (shared buffers) + BSS
#   SD_RAM   $0a00-$0bff  SD card write buffer, page aligned
#   FAT_RAM  $0c00-$0dff  FAT32 sector workspace, page aligned
#   BAS_RAM  $0e00-$0fff  MS-BASIC line input:
#              $0e00-$0eff  guard page - PUT_NEW_LINE builds the link and line
#                           number at INPUTBUFFER-4..INPUTBUFFER-1
#              $0f00-$0fff  INPUTBUFFER itself, page aligned
# Sizes are deliberately tight so ld65 reports an overflow instead of
# letting segments silently overlap the fixed-address buffers.
  SYS_RAM:   start=$0200, size=$0800, type=rw, define=yes, fill=yes, fillval=$00, file="";
  SD_RAM:    start=$0a00, size=$0200, type=rw, define=yes, file="";
  FAT_RAM:   start=$0c00, size=$0200, type=rw, define=yes, file="";
  BAS_RAM:   start=$0e00, size=$0200, type=rw, define=yes, file="";
  USERRAM:   start=$1000, size=$7000, type=rw, define=yes, fill=yes, fillval=$00, file="";
  VDP:       start=$8080, size=$0080, type=rw, define=yes, file="";
  ACIA:      start=$8400, size=$0400, type=rw, define=yes, file="";
  VIA2:      start=$8800, size=$0800, type=rw, define=yes, file="";
  VIA1:      start=$9000, size=$1000, type=rw, define=yes, file="";
  VIA3:      start=$8200, size=$0200, type=rw, define=yes, file=""; 
  FILLER:    start=$8000, size=$2000, type=rw, fill=yes,   fillval=$ea, file=%O;
  ROM:       start=$a000, size=$6000, type=ro, define=yes, fill=yes,   fillval=$ea, file=%O;
  BAS_DUM:   start=$0000, size=$00ff, file="";
}

SEGMENTS
{
  ZEROPAGE:  load=ZP,        type=ZP,  define=yes;
  SYSRAM:    load=SYS_RAM,   type=rw,  define=yes,   align=$0100, optional=yes;
  BSS:       load=SYS_RAM,   type=bss, define=yes;
  SDBUF:     load=SD_RAM,    type=bss, define=yes,   align=$0100, optional=yes;
  FATBUF:    load=FAT_RAM,   type=bss, define=yes,   align=$0100, optional=yes;
  BASBUF:    load=BAS_RAM,   type=bss, define=yes,   align=$0100, optional=yes;
  STARTUP:   load=ROM,       type=ro,  define=yes,   optional=yes;
  CODE:      load=ROM,       type=ro,  define=yes;
  DATA:      load=ROM,       type=rw,  define=yes,   run=SYS_RAM;
  RODATA:    load=ROM,       type=ro,  define=yes,   optional=yes;
	BAS_VEC:   load=ROM,	     type=ro   optional=yes;
	BAS_KEY:   load=ROM,	     type=ro,  optional=yes, define=yes;
	BAS_ERR:   load=ROM,	     type=ro,  optional=yes;
  RODATA_PA: load=ROM,       type=ro,  define=yes,   optional=yes, align=$0100;
# Experiment, see MEMORY_MAP.md 5.5. $445D is $E45D, in the hole that RODATA_PA
# used to occupy, and its low byte is the one vdp_wait has today - so the VDP
# routines keep every page boundary they have and only their high address byte
# changes.
  VDPCODE:   load=ROM,       type=ro,  define=yes,   offset=$445D, optional=yes;
  EXTCODE:   load=ROM,       type=ro,  define=yes,   offset=$4700, optional=yes;
  SDCODE:    load=ROM,       type=ro,  define=yes,   offset=$4c00, optional=yes;
  SYSCALLS:  load=ROM,       type=ro,  define=yes,   offset=$5800, optional=yes;
  EXTCODE2:  load=ROM,       type=ro,  define=yes,   offset=$5900, optional=yes;
  VECTORS:   load=ROM,       type=ro,  define=yes,   offset=$5ffa, optional=yes;
	BAS_DUM:   load=BAS_DUM,   optional=yes;
}
