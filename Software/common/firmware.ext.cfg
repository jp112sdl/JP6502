MEMORY
{
  ZP:        start=$0000, size=$0100, type=rw;
# System RAM layout ($0200-$0FFF):
#   SYS_RAM  $0200-$09ff  SYSRAM (shared buffers) + BSS
#   SD_RAM   $0a00-$0bff  SD card write buffer, page aligned
#   FAT_RAM  $0c00-$0dff  FAT32 sector workspace, page aligned
#   BAS_RAM  $0e00-$0fff  MS-BASIC line input:
#              $0e00-$0eff  guard page - PUT_NEW_LINE builds the link and line
#                           number at INPUTBUFFER-4..INPUTBUFFER-1
#              $0f00-$0fff  INPUTBUFFER itself, page aligned
# Sizes are deliberately tight so ld65 reports an overflow instead of
# letting segments silently overlap the fixed-address buffers.
  SYS_RAM:   start=$0200, size=$0800, type=rw, define=yes, fill=yes, fillval=$00, file="";
  SD_RAM:    start=$0a00, size=$0200, type=rw, define=yes, file="";
  FAT_RAM:   start=$0c00, size=$0200, type=rw, define=yes, file="";
  BAS_RAM:   start=$0e00, size=$0200, type=rw, define=yes, file="";
  USERRAM:   start=$1000, size=$7000, type=rw, define=yes, fill=yes, fillval=$00, file="";
  VDP:       start=$8080, size=$0080, type=rw, define=yes, file="";
  ACIA:      start=$8400, size=$0400, type=rw, define=yes, file="";
  VIA2:      start=$8800, size=$0800, type=rw, define=yes, file="";
  VIA1:      start=$9000, size=$1000, type=rw, define=yes, file="";
  VIA3:      start=$8200, size=$0200, type=rw, define=yes, file=""; 
  FILLER:    start=$8000, size=$2000, type=rw, fill=yes,   fillval=$ea, file=%O;
  ROM:       start=$a000, size=$6000, type=ro, define=yes, fill=yes,   fillval=$ea, file=%O;
  BAS_DUM:   start=$0000, size=$00ff, file="";
}

SEGMENTS
{
  ZEROPAGE:  load=ZP,        type=ZP,  define=yes;
  SYSRAM:    load=SYS_RAM,   type=rw,  define=yes,   align=$0100, optional=yes;
  BSS:       load=SYS_RAM,   type=bss, define=yes;
  SDBUF:     load=SD_RAM,    type=bss, define=yes,   align=$0100, optional=yes;
  FATBUF:    load=FAT_RAM,   type=bss, define=yes,   align=$0100, optional=yes;
  BASBUF:    load=BAS_RAM,   type=bss, define=yes,   align=$0100, optional=yes;
  STARTUP:   load=ROM,       type=ro,  define=yes,   optional=yes;
  CODE:      load=ROM,       type=ro,  define=yes;
  DATA:      load=ROM,       type=rw,  define=yes,   run=SYS_RAM;
# rom/vdp_lobyte only: sixteen copies of the same control-port probe, one per
# low address byte from $00 to $F0, each in a page of its own so that no two
# overlap. See MEMORY_MAP.md 5.5.
  PROBE_00:  load=ROM,       type=ro,  define=yes,   offset=$1000, optional=yes;
  PROBE_01:  load=ROM,       type=ro,  define=yes,   offset=$1110, optional=yes;
  PROBE_02:  load=ROM,       type=ro,  define=yes,   offset=$1220, optional=yes;
  PROBE_03:  load=ROM,       type=ro,  define=yes,   offset=$1330, optional=yes;
  PROBE_04:  load=ROM,       type=ro,  define=yes,   offset=$1440, optional=yes;
  PROBE_05:  load=ROM,       type=ro,  define=yes,   offset=$1550, optional=yes;
  PROBE_06:  load=ROM,       type=ro,  define=yes,   offset=$1660, optional=yes;
  PROBE_07:  load=ROM,       type=ro,  define=yes,   offset=$1770, optional=yes;
  PROBE_08:  load=ROM,       type=ro,  define=yes,   offset=$1880, optional=yes;
  PROBE_09:  load=ROM,       type=ro,  define=yes,   offset=$1990, optional=yes;
  PROBE_0A:  load=ROM,       type=ro,  define=yes,   offset=$1AA0, optional=yes;
  PROBE_0B:  load=ROM,       type=ro,  define=yes,   offset=$1BB0, optional=yes;
  PROBE_0C:  load=ROM,       type=ro,  define=yes,   offset=$1CC0, optional=yes;
  PROBE_0D:  load=ROM,       type=ro,  define=yes,   offset=$1DD0, optional=yes;
  PROBE_0E:  load=ROM,       type=ro,  define=yes,   offset=$1EE0, optional=yes;
  PROBE_0F:  load=ROM,       type=ro,  define=yes,   offset=$1FF0, optional=yes;

  RODATA:    load=ROM,       type=ro,  define=yes,   optional=yes;
	BAS_VEC:   load=ROM,	     type=ro   optional=yes;
	BAS_KEY:   load=ROM,	     type=ro,  optional=yes, define=yes;
	BAS_ERR:   load=ROM,	     type=ro,  optional=yes;
  RODATA_PA: load=ROM,       type=ro,  define=yes,   optional=yes, align=$0100;
# Experiment, see MEMORY_MAP.md 5.5. $43B7 is $E3B7, an address at which the
# VDP routines are known to fail. rom/vdp_diag is built with them there so that
# the failure produces numbers on the LCD instead of a bad picture.
  VDPCODE:   load=ROM,       type=ro,  define=yes,   offset=$43B7, optional=yes;
# rom/vdp_lobyte2 only: the same control-port probe at sixteen low bytes,
# $40 to $B8 in steps of 8, linked twice over. Set A puts low byte k in page
# $D0+k, set B puts the same low byte in page $D0+((k+8) mod 16), so page and
# low byte are no longer the same variable. See MEMORY_MAP.md 5.5.
  PRA_00:  load=ROM,       type=ro,  define=yes,   offset=$3040, optional=yes;
  PRB_08:  load=ROM,       type=ro,  define=yes,   offset=$3080, optional=yes;
  PRA_01:  load=ROM,       type=ro,  define=yes,   offset=$3148, optional=yes;
  PRB_09:  load=ROM,       type=ro,  define=yes,   offset=$3188, optional=yes;
  PRA_02:  load=ROM,       type=ro,  define=yes,   offset=$3250, optional=yes;
  PRB_0A:  load=ROM,       type=ro,  define=yes,   offset=$3290, optional=yes;
  PRA_03:  load=ROM,       type=ro,  define=yes,   offset=$3358, optional=yes;
  PRB_0B:  load=ROM,       type=ro,  define=yes,   offset=$3398, optional=yes;
  PRA_04:  load=ROM,       type=ro,  define=yes,   offset=$3460, optional=yes;
  PRB_0C:  load=ROM,       type=ro,  define=yes,   offset=$34A0, optional=yes;
  PRA_05:  load=ROM,       type=ro,  define=yes,   offset=$3568, optional=yes;
  PRB_0D:  load=ROM,       type=ro,  define=yes,   offset=$35A8, optional=yes;
  PRA_06:  load=ROM,       type=ro,  define=yes,   offset=$3670, optional=yes;
  PRB_0E:  load=ROM,       type=ro,  define=yes,   offset=$36B0, optional=yes;
  PRA_07:  load=ROM,       type=ro,  define=yes,   offset=$3778, optional=yes;
  PRB_0F:  load=ROM,       type=ro,  define=yes,   offset=$37B8, optional=yes;
  PRB_00:  load=ROM,       type=ro,  define=yes,   offset=$3840, optional=yes;
  PRA_08:  load=ROM,       type=ro,  define=yes,   offset=$3880, optional=yes;
  PRB_01:  load=ROM,       type=ro,  define=yes,   offset=$3948, optional=yes;
  PRA_09:  load=ROM,       type=ro,  define=yes,   offset=$3988, optional=yes;
  PRB_02:  load=ROM,       type=ro,  define=yes,   offset=$3A50, optional=yes;
  PRA_0A:  load=ROM,       type=ro,  define=yes,   offset=$3A90, optional=yes;
  PRB_03:  load=ROM,       type=ro,  define=yes,   offset=$3B58, optional=yes;
  PRA_0B:  load=ROM,       type=ro,  define=yes,   offset=$3B98, optional=yes;
  PRB_04:  load=ROM,       type=ro,  define=yes,   offset=$3C60, optional=yes;
  PRA_0C:  load=ROM,       type=ro,  define=yes,   offset=$3CA0, optional=yes;
  PRB_05:  load=ROM,       type=ro,  define=yes,   offset=$3D68, optional=yes;
  PRA_0D:  load=ROM,       type=ro,  define=yes,   offset=$3DA8, optional=yes;
  PRB_06:  load=ROM,       type=ro,  define=yes,   offset=$3E70, optional=yes;
  PRA_0E:  load=ROM,       type=ro,  define=yes,   offset=$3EB0, optional=yes;
  PRB_07:  load=ROM,       type=ro,  define=yes,   offset=$3F78, optional=yes;
  PRA_0F:  load=ROM,       type=ro,  define=yes,   offset=$3FB8, optional=yes;
  EXTCODE:   load=ROM,       type=ro,  define=yes,   offset=$4700, optional=yes;
  SDCODE:    load=ROM,       type=ro,  define=yes,   offset=$4c00, optional=yes;
  SYSCALLS:  load=ROM,       type=ro,  define=yes,   offset=$5800, optional=yes;
  EXTCODE2:  load=ROM,       type=ro,  define=yes,   offset=$5900, optional=yes;
  VECTORS:   load=ROM,       type=ro,  define=yes,   offset=$5ffa, optional=yes;
	BAS_DUM:   load=BAS_DUM,   optional=yes;
}
